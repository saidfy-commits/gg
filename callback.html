<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OAuth Callback - DriftLoop</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  .box { background: #f4f4f4; border-radius: 8px; padding: 20px; margin-top: 20px; word-break: break-all; }
  .label { font-weight: bold; color: #555; }
  .code { font-size: 1.2em; color: #d6336c; }
</style>
</head>
<body>
<h1>OAuth callback received</h1>
<p>Copy the value below and paste it wherever you need the authorization code.</p>

<div class="box">
  <div class="label">authorization code:</div>
  <div class="code" id="code">(none found)</div>
</div>

<div class="box">
  <div class="label">full callback URL:</div>
  <div id="full-url"></div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  document.getElementById("code").textContent = code || "(none found)";
  document.getElementById("full-url").textContent = window.location.href;
</script>
</body>
</html>
